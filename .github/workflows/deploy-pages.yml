name: Deploy Body Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a deployment midway. Keep only the latest pending update.
concurrency:
  group: body-build-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret. See web/README.md.'
            exit 1
          fi
      - name: Record deployed commit
        run: node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("dist/release.json", JSON.stringify({commit:process.env.GITHUB_SHA}));'
      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 492dd27e3dda26ed2fe8035de32b05e1
          workingDirectory: web
          wranglerVersion: '4.148.0'
          command: pages deploy dist --project-name=body-build-gadxx --branch=main
      - name: Verify public deployment
        run: |
          node --input-type=module <<'JS'
          const url = 'https://body-build-gadxx.pages.dev/release.json';
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(`${url}?verify=${process.env.GITHUB_SHA}-${attempt}`, {
                cache: 'no-store', signal: AbortSignal.timeout(10000),
              });
              if (response.ok && (await response.json()).commit === process.env.GITHUB_SHA) {
                console.log('Verified: https://body-build-gadxx.pages.dev/');
                process.exit(0);
              }
            } catch (error) {
              console.log(`Verification attempt ${attempt + 1}: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Deployment was submitted, but the public URL did not confirm the new commit. Check Cloudflare before retrying.');
          JS
